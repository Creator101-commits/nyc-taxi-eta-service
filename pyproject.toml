[project]
name = "nyc-taxi-eta-service"
version = "0.1.0"
description = "NYC taxi trip-time model with drift alarms, retraining policies, FastAPI service and map website."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sreeharsha Kannegundla" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "polars==2.1.0",
    "pyarrow>=18",
    "scipy>=1.14",
    "lightgbm==4.7.0",
    "pyshp>=2.3",
    "fastapi==0.163.0",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.scripts]
nyc-eta = "nyc_eta.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nyc_eta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nyc_eta --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option in defaults is the framework's required idiom.
"src/nyc_eta/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
