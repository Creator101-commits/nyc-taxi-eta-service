name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke
        run: npx playwright test
      - name: Upload e2e screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-screenshot
          path: web/test-results/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install "3.13"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build website
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build image
        run: docker build -t nyc-eta-service .
      - name: Smoke test API and site
        run: |
          docker run -d --name nyc -p 8000:8000 nyc-eta-service
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/ready
          curl -sf http://localhost:8000/zones | grep -q '"zones"'
          curl -sf http://localhost:8000/model-info | grep -q 'model_version'
          curl -sf http://localhost:8000/ | grep -qi "NYC Taxi"
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 1, "dropoff_zone_id": 2, "pickup_datetime": "2019-07-04T08:30:00"}' \
            | grep -q '"minutes"'
          docker rm -f nyc
